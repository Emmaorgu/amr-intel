# render.yaml — AMR-Sentinel infrastructure as code
# All services on Render free tier
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── 1. FastAPI Backend ──────────────────────────────────────────────────
  - type: web
    name: amr-sentinel-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m uvicorn amr_sentinel.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DB_USER
        fromDatabase:
          name: amr-sentinel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: amr-sentinel-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: amr-sentinel-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: amr-sentinel-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: amr-sentinel-db
          property: database
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NCBI_SSL_VERIFY
        value: "false"
      - key: API_KEY
        value: ""
      - key: CORS_ORIGINS
        value: "https://amr-intel.com,https://www.amr-intel.com,https://amr-sentinel-dashboard.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11"

  # ─── 2. Pipeline Cron Job (every 6 hours — signal detection + bulletins) ─
  - type: cron
    name: amr-sentinel-pipeline
    runtime: python
    region: oregon
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m amr_sentinel.orchestrator --run-once --skip-ingestion
    envVars:
      - key: DB_USER
        fromDatabase:
          name: amr-sentinel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: amr-sentinel-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: amr-sentinel-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: amr-sentinel-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: amr-sentinel-db
          property: database
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NCBI_SSL_VERIFY
        value: "false"
      - key: MAX_STEWARDSHIP_ALERTS
        value: "20"
      - key: PYTHON_VERSION
        value: "3.11"

  # ─── 3. Daily Full Pipeline (02:00 UTC — ingestion + detection + bulletins)
  # Runs full ingestion (GLASS, ECDC delta) + pipeline + bulletin backfill
  - type: cron
    name: amr-intel-daily-pipeline
    runtime: python
    region: oregon
    schedule: "0 2 * * *"
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m amr_sentinel.scripts.daily_pipeline
    envVars:
      - key: DB_USER
        fromDatabase:
          name: amr-sentinel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: amr-sentinel-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: amr-sentinel-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: amr-sentinel-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: amr-sentinel-db
          property: database
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NCBI_SSL_VERIFY
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"

  # ─── 4. React Dashboard (Static Site — always free) ──────────────────────
  - type: web
    name: amr-sentinel-dashboard
    runtime: static
    buildCommand: npm --prefix dashboard install --legacy-peer-deps && npm --prefix dashboard run build
    staticPublishPath: dashboard/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ─── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: amr-sentinel-db
    databaseName: amr_sentinel
    region: oregon
    plan: free