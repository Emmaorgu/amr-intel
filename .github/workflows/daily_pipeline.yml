name: AMR-Intel Daily Pipeline

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: "0 2 * * *"
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Run AMR-Intel Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout repo ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-render.txt

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements-render.txt

      # ── 4. Run pipeline ────────────────────────────────────────────────────
      - name: Run daily pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: "5432"
          DB_NAME: amr_sentinel
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_SSL_VERIFY: "false"
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m amr_sentinel.scripts.daily_pipeline

      # ── 5. Report outcome ──────────────────────────────────────────────────
      - name: Pipeline complete
        if: success()
        run: echo "AMR-Intel daily pipeline completed successfully."

      - name: Pipeline failed
        if: failure()
        run: echo "AMR-Intel daily pipeline failed. Check logs above."