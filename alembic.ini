# Alembic configuration for AMR-Sentinel
# Place this file at the project root: C:\Users\Admin\PycharmProjects\amr-sentinel\alembic.ini

[alembic]
# Path to the migration scripts directory
script_location = alembic

# Database URL — overridden at runtime by env.py reading from .env
# Do NOT put real credentials here; env.py reads from .env instead
sqlalchemy.url = postgresql+psycopg2://postgres:password@localhost:5432/amr_sentinel

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S